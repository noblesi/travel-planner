spring:
  application:
    name: travel-planner
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:travel_planner}
    password: ${ORACLE_PASSWORD:travel_planner}
    driver-class-name: oracle.jdbc.OracleDriver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.noblesi.travelplanner
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  auth:
    enforce-security: ${AUTH_ENFORCE_SECURITY:true}
  external-api:
    tour:
      base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
      service-key: ${TOUR_API_SERVICE_KEY:}
      mobile-app: ${TOUR_API_MOBILE_APP:WithTrip}
      connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${TOUR_API_READ_TIMEOUT:5s}
    kakao:
      base-url: ${KAKAO_REST_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      connect-timeout: ${KAKAO_REST_CONNECT_TIMEOUT:3s}
      read-timeout: ${KAKAO_REST_READ_TIMEOUT:5s}
