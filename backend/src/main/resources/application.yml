spring:
  application:
    name: travel-planner-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:travel_planner}
    password: ${ORACLE_PASSWORD:travel_planner}
    driver-class-name: oracle.jdbc.OracleDriver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.noblesi.travelplanner
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
