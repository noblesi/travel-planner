spring:
  application:
    name: travel-planner
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 초대 API가 SMTP 장애로 무기한 대기하지 않도록 모든 네트워크 구간에 명시적인 상한을 둔다.
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.noblesi.travelplanner
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  auth:
    enforce-security: ${AUTH_ENFORCE_SECURITY:true}
  mail:
    from: ${MAIL_FROM:no-reply@withtrip.com}
    async:
      core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:100}
      await-termination: ${MAIL_ASYNC_AWAIT_TERMINATION:10s}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  external-api:
    tour:
      base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
      service-key: ${TOUR_API_SERVICE_KEY:}
      mobile-app: ${TOUR_API_MOBILE_APP:WithTrip}
      connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${TOUR_API_READ_TIMEOUT:5s}
    kakao:
      base-url: ${KAKAO_REST_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
      connect-timeout: ${KAKAO_REST_CONNECT_TIMEOUT:3s}
      read-timeout: ${KAKAO_REST_READ_TIMEOUT:5s}
