<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지사항 관리 | WithTrip</title><link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}"></head><body><div class="admin-layout"><aside th:replace="~{admin/fragments/layout :: sidebar('notices')}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header><main class="admin-content">
<div class="page-header"><div><h1>공지사항 관리</h1><p>서비스 공지사항의 등록 및 노출 상태를 관리합니다.</p></div><a class="button" th:href="@{/admin/notices/new}">새 공지 작성</a></div><section class="card"><div class="panel-heading"><h2>공지사항 목록</h2></div><form class="filters notice-filters" method="get"><input name="keyword" placeholder="공지 제목 검색"><select name="category"><option value="">분류 전체</option><option value="GUIDE">안내</option><option value="SYSTEM">시스템</option></select><button class="button">검색</button><a class="button secondary" th:href="@{/admin/notices/new}">새 공지 작성</a></form>
<div class="table-wrapper"><table class="admin-table"><thead><tr><th>번호</th><th>제목</th><th>분류</th><th>노출 상태</th><th>등록일</th><th>관리</th></tr></thead><tbody><tr th:each="notice:${notices.content}"><td th:text="${notice.noticeId}">1</td><td class="title"><a th:href="@{/admin/notices/{id}(id=${notice.noticeId})}" th:text="${notice.title}">제목</a></td><td th:text="${notice.category}">분류</td><td><span class="badge success">게시중</span></td><td th:text="${notice.createdAt}">날짜</td><td><div class="table-actions"><a class="mini-button" th:href="@{/admin/notices/{id}(id=${notice.noticeId})}">상세</a><a class="mini-button primary" th:href="@{/admin/notices/{id}/edit(id=${notice.noticeId})}">수정</a><button class="mini-button danger" type="button">삭제</button></div></td></tr><tr th:if="${#lists.isEmpty(notices.content)}"><td colspan="6">등록된 공지사항이 없습니다.</td></tr></tbody></table></div><nav class="pagination" th:if="${notices.pagination.totalPages > 0}"><a th:each="number:${#numbers.sequence(notices.pagination.startPage,notices.pagination.endPage)}" th:href="@{/admin/notices(page=${number},category=${category})}" th:text="${number}" th:classappend="${number == notices.pagination.page} ? ' active'">1</a></nav></section>
</main></div></div><script th:src="@{/assets/admin/js/admin.js}"></script></body></html>
