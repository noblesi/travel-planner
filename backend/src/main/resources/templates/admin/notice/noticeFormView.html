<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지사항 관리 | WithTrip</title>
    <link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{admin/fragments/layout :: sidebar('notices')}"></aside>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
        <main class="admin-content">
            <div class="page-header">
                <div>
                    <h1>공지사항 관리</h1>
                    <p>서비스 공지사항의 등록과 노출 상태를 관리합니다.</p>
                </div>
                <a class="button" th:href="@{/admin/notices/new}">새 공지 작성</a>
            </div>

            <div class="admin-toast show" th:if="${message}" th:text="${message}">처리되었습니다.</div>

            <section class="card">
                <div class="panel-heading"><h2>공지사항 목록</h2></div>
                <form class="filters notice-filters" method="get" th:action="@{/admin/notices}">
                    <input name="keyword" th:value="${keyword}" placeholder="제목 또는 내용 검색">
                    <select name="categoryCode" aria-label="공지 분류" onchange="this.form.requestSubmit()">
                        <option value="">분류 전체</option>
                        <option value="GUIDE" th:selected="${categoryCode == 'GUIDE'}">안내</option>
                        <option value="MAINTENANCE" th:selected="${categoryCode == 'MAINTENANCE'}">점검</option>
                    </select>
                    <button class="button" type="submit">검색</button>
                </form>

                <div class="table-wrapper">
                    <table class="admin-table notice-table">
                        <thead><tr><th>번호</th><th>제목</th><th>분류</th><th>조회</th><th>작성자</th><th>등록일</th><th>관리</th></tr></thead>
                        <tbody>
                        <tr th:each="notice : ${notices.content}">
                            <td th:text="${notice.noticeId}">1</td>
                            <td class="title"><a th:href="@{/admin/notices/{id}(id=${notice.noticeId})}" th:text="${notice.title}">제목</a></td>
                            <td th:text="${notice.categoryCode == 'GUIDE' ? '안내' : (notice.categoryCode == 'MAINTENANCE' ? '점검' : notice.categoryCode)}">안내</td>
                            <td th:text="${notice.viewCount}">0</td>
                            <td th:text="${notice.adminName}">관리자</td>
                            <td th:text="${notice.createdAt != null ? #temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">2026-08-11 16:15</td>
                            <td><div class="table-actions">
                                <a class="mini-button" th:href="@{/admin/notices/{id}(id=${notice.noticeId})}">상세</a>
                                <a class="mini-button primary" th:href="@{/admin/notices/{id}/edit(id=${notice.noticeId})}">수정</a>
                                <form method="post" th:action="@{/admin/notices/{id}/delete(id=${notice.noticeId})}" onsubmit="return confirm('공지사항을 삭제하시겠습니까?');">
                                    <button class="mini-button danger" type="submit">삭제</button>
                                </form>
                            </div></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(notices.content)}"><td colspan="7">조회된 공지사항이 없습니다.</td></tr>
                        </tbody>
                    </table>
                </div>

                <nav class="pagination" aria-label="공지사항 목록 페이지" th:if="${notices.pagination.totalPages > 1}">
                    <a class="pagination-direction" th:if="${notices.pagination.hasPrevious()}"
                       th:href="@{/admin/notices(page=${notices.pagination.page - 1},keyword=${keyword},categoryCode=${categoryCode})}">이전</a>
                    <span class="pagination-direction disabled" th:unless="${notices.pagination.hasPrevious()}">이전</span>
                    <a th:each="number : ${#numbers.sequence(notices.pagination.startPage, notices.pagination.endPage)}"
                       th:href="@{/admin/notices(page=${number},keyword=${keyword},categoryCode=${categoryCode})}"
                       th:text="${number}" th:classappend="${number == notices.pagination.page} ? ' active'"
                       th:attr="aria-current=${number == notices.pagination.page ? 'page' : null}">1</a>
                    <a class="pagination-direction" th:if="${notices.pagination.hasNext()}"
                       th:href="@{/admin/notices(page=${notices.pagination.page + 1},keyword=${keyword},categoryCode=${categoryCode})}">다음</a>
                    <span class="pagination-direction disabled" th:unless="${notices.pagination.hasNext()}">다음</span>
                </nav>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/assets/admin/js/admin.js}"></script>
</body>
</html>
