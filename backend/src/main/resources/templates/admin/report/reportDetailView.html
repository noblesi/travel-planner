<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신고 상세 | WithTrip</title>
<link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{admin/fragments/layout :: sidebar('trips')}"></aside>
		<div class="admin-main">
			<header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
			<main class="admin-content">
				<div class="page-header">
					<div><h1>신고 상세</h1><p>여행 플랜 신고 내용과 처리 상태를 확인합니다.</p></div>
					<a class="button secondary" th:href="@{/admin/trips(reportedOnly=true)}">목록으로</a>
				</div>
				<p class="alert success" th:if="${message}" th:text="${message}"></p>
				<div class="content-grid">
					<article class="card">
						<h2>신고 정보</h2>
						<dl class="info-grid">
							<div><dt>신고 번호</dt><dd th:text="${report.reportId}">1</dd></div>
							<div><dt>플랜 번호</dt><dd th:text="${report.planId}">1</dd></div>
							<div><dt>신고인</dt><dd th:text="${report.reporterName}">홍길동</dd></div>
							<div><dt>신고일</dt><dd th:text="${report.createdAt}">2026-08-13</dd></div>
							<div><dt>신고 사유</dt><dd th:text="${report.reasonCode}">INAPPROPRIATE</dd></div>
							<div><dt>처리 상태</dt><dd><span class="badge" th:text="${report.reportStatus}">PENDING</span></dd></div>
						</dl>
						<h2>신고 내용</h2>
						<p class="report-content" th:text="${#strings.isEmpty(report.reasonDetail) ? '상세 신고 내용이 없습니다.' : report.reasonDetail}">신고 상세 내용</p>
					</article>
					<aside class="card">
						<h2>신고 대상 플랜</h2>
						<a class="target-trip-card" th:href="@{/admin/trips/{planId}(planId=${report.planId})}">
							<span th:text="|플랜 번호 ${report.planId}|">플랜 번호</span>
							<strong th:text="${report.planTitle}">여행 플랜 상세로 이동</strong>
						</a>
						<div th:if="${report.reportStatus != 'RESOLVED'}">
							<h2 class="section-gap">처리 결과</h2>
							<form th:action="@{/admin/reports/{reportId}/complete(reportId=${report.reportId})}" th:object="${processForm}" method="post">
								<div class="radio-group">
									<label><input type="radio" th:field="*{processResultCode}" value="REJECTED"> 반려</label>
									<label><input type="radio" th:field="*{processResultCode}" value="WARNING"> 경고</label>
									<label><input type="radio" th:field="*{processResultCode}" value="HIDDEN"> 숨김</label>
								</div>
								<textarea class="memo" th:field="*{processReason}" placeholder="처리 사유 입력"></textarea>
								<button class="button full-button" type="submit">검토 완료</button>
							</form>
						</div>
						<div th:if="${report.reportStatus == 'RESOLVED'}">
							<h2 class="section-gap">처리 내역</h2>
							<p th:text="${report.processResultCode}">WARNING</p>
							<p class="report-content" th:text="${report.processReason}">처리 사유</p>
						</div>
					</aside>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/assets/admin/js/admin.js}"></script>
</body>
</html>
