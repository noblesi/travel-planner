<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관광 데이터 관리 | WithTrip</title>
<link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{admin/fragments/layout :: sidebar('tour-data')}"></aside>
		<div class="admin-main">
			<header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
			<main class="admin-content">
				<div class="page-header">
					<div>
						<h1>관광 데이터 관리</h1>
						<p>한국관광공사 TOUR API 데이터를 동기화하고 실행 결과를 확인합니다.</p>
					</div>
					<form th:action="@{/admin/tour-data/sync}" method="post">
						<button class="button" type="submit" th:disabled="${syncing}"
								th:text="${syncing} ? '동기화 중' : '지금 동기화'">지금 동기화</button>
					</form>
				</div>

				<div class="admin-toast show" th:if="${message}" th:text="${message}"></div>
				<div class="admin-toast show" th:if="${errorMessage}" th:text="${errorMessage}"></div>

				<section class="summary-grid">
					<article class="summary-card" th:each="item : ${summary}">
						<span th:text="${item.label}">항목</span>
						<strong th:text="${item.count}">0</strong>
						<small>등록 데이터</small>
					</article>
				</section>

				<section class="card connection">
					<span class="connection-dot"></span>
					<div>
						<h2>TOUR API 연결</h2>
						<p th:if="${lastSyncedAt != null}"
								th:text="|마지막 동기화 ${#temporals.format(lastSyncedAt, 'yyyy.MM.dd HH:mm')}|">마지막 동기화</p>
						<p th:unless="${lastSyncedAt != null}">아직 동기화된 데이터가 없습니다.</p>
					</div>
				</section>

				<section class="card">
					<h2>최근 동기화 이력</h2>
					<div class="table-wrapper">
						<table class="admin-table">
							<thead>
								<tr>
									<th class="text-column">작업 번호</th>
									<th>시작 시각</th>
									<th>처리</th>
									<th>실패</th>
									<th>상태</th>
									<th class="text-column">담당자</th>
								</tr>
							</thead>
							<tbody>
								<tr th:if="${#lists.isEmpty(history)}">
									<td colspan="6">동기화 이력이 없습니다.</td>
								</tr>
								<tr th:each="sync : ${history}">
									<td class="text-column" th:text="${sync.id}">S</td>
									<td th:text="${sync.startedAt}">날짜</td>
									<td th:text="${sync.changedCount}">0</td>
									<td th:text="${sync.failedCount}">0</td>
									<td><span class="badge"
											th:classappend="${sync.status == '성공' or sync.status == '완료'} ? ' success' : ' warning'"
											th:text="${sync.status}">성공</span></td>
									<td class="text-column" th:text="${sync.manager}">관리자</td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script th:src="@{/assets/admin/js/admin.js}"></script>
</body>
</html>
