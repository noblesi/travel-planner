<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>회원 관리 | WithTrip</title>
	<link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{admin/fragments/layout :: sidebar('members')}"></aside>
		<div class="admin-main">
			<header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
			<main class="admin-content">
				<div class="page-header">
					<div>
						<h1>회원 관리</h1>
						<p>회원 정보와 활동 현황, 계정 상태를 조회하고 관리합니다.</p>
					</div>
				</div>

				<section class="card">
					<div class="tabs">
						<a th:href="@{/admin/members}"
							th:classappend="${#strings.isEmpty(memberStatus)} ? 'active'">전체 회원</a>
						<a th:href="@{/admin/members(memberStatus='ACTIVE')}"
							th:classappend="${memberStatus == 'ACTIVE'} ? 'active'">정상</a>
						<a th:href="@{/admin/members(memberStatus='WITHDRAWN')}"
							th:classappend="${memberStatus == 'WITHDRAWN'} ? 'active'">탈퇴</a>
					</div>

					<form class="filters" method="get" th:action="@{/admin/members}">
						<input name="keyword" th:value="${keyword}"
							placeholder="이름, 닉네임, 이메일 검색">
						<select name="memberStatus">
							<option value="">상태 전체</option>
							<option value="ACTIVE" th:selected="${memberStatus == 'ACTIVE'}">정상</option>
							<option value="WITHDRAWN" th:selected="${memberStatus == 'WITHDRAWN'}">탈퇴</option>
						</select>
						<button class="button" type="submit">검색</button>
					</form>

					<div class="table-wrapper">
						<table class="admin-table">
							<thead>
								<tr>
									<th class="text-column">회원 번호</th>
									<th class="text-column">이름/닉네임</th>
									<th class="text-column">이메일</th>
									<th>가입일</th>
									<th>플랜</th>
									<th>신고받은 플랜</th>
									<th>상태</th>
									<th>관리</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="member : ${members.content}">
									<td class="text-column" th:text="${member.memberId}">1</td>
									<td class="text-column"
										th:text="|${member.memberName} / ${member.memberNickName}|">이름 / 닉네임</td>
									<td class="text-column" th:text="${member.email}">member@example.com</td>
									<td th:text="${#dates.format(member.createdAt, 'yyyy.MM.dd')}">2026.08.07</td>
									<td th:text="${member.planCount}">0</td>
									<td th:text="${member.reportedPlanCount}">0</td>
									<td>
										<span class="badge"
											th:classappend="${member.memberStatus == 'ACTIVE'} ? ' success' : ' muted'"
											th:text="${member.memberStatus == 'ACTIVE' ? '정상' : '탈퇴'}">정상</span>
									</td>
									<td>
										<div class="table-actions">
											<a class="mini-button primary"
												th:href="@{/admin/members/{memberId}(memberId=${member.memberId})}">상세</a>
											<form method="post"
												th:action="@{/admin/members/{memberId}/status(memberId=${member.memberId})}">
												<input type="hidden" name="memberStatus"
													th:value="${member.memberStatus == 'ACTIVE' ? 'WITHDRAWN' : 'ACTIVE'}">
												<button class="mini-button" type="submit"
													th:classappend="${member.memberStatus == 'ACTIVE'} ? ' danger' : ' success'"
													th:text="${member.memberStatus == 'ACTIVE' ? '탈퇴 처리' : '상태 복구'}">상태 변경</button>
											</form>
										</div>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(members.content)}">
									<td colspan="8">조회된 회원이 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
					<nav class="pagination" aria-label="회원 목록 페이지" th:if="${members.pagination.totalPages > 1}">
						<a class="pagination-direction" th:if="${members.pagination.hasPrevious()}"
							th:href="@{/admin/members(page=${members.pagination.page - 1},keyword=${keyword},memberStatus=${memberStatus})}">이전</a>
						<span class="pagination-direction disabled" th:unless="${members.pagination.hasPrevious()}">이전</span>
						<a th:each="number : ${#numbers.sequence(members.pagination.startPage, members.pagination.endPage)}"
							th:href="@{/admin/members(page=${number},keyword=${keyword},memberStatus=${memberStatus})}"
							th:text="${number}" th:classappend="${number == members.pagination.page} ? ' active'"
							th:attr="aria-current=${number == members.pagination.page ? 'page' : null}">1</a>
						<a class="pagination-direction" th:if="${members.pagination.hasNext()}"
							th:href="@{/admin/members(page=${members.pagination.page + 1},keyword=${keyword},memberStatus=${memberStatus})}">다음</a>
						<span class="pagination-direction disabled" th:unless="${members.pagination.hasNext()}">다음</span>
					</nav>
				</section>
			</main>
		</div>
	</div>
	<script th:src="@{/assets/admin/js/admin.js}"></script>
</body>
</html>
