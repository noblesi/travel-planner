<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원 관리 | WithTrip</title>
<link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{admin/fragments/layout :: sidebar('members')}"></aside>
		<div class="admin-main">
			<header
				th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
			<main class="admin-content">
				<div class="page-header">
					<div>
						<h1>회원 관리</h1>
						<p>회원 상태와 서비스 활동 내역을 조회하고 관리합니다.</p>
					</div>
				</div>
				<section class="card">
					<div class="tabs">
						<a class="active" th:href="@{/admin/members}">전체 회원</a><a href="#">정상</a><a
							href="#">정지</a><a href="#">탈퇴</a>
					</div>
					<form class="filters" method="get">
						<input name="keyword" th:value="${keyword}"
							placeholder="아이디, 이름, 이메일 검색"><select><option>가입
								기간 전체</option>
							<option>최근 7일</option>
							<option>최근 30일</option></select><select><option>상태 전체</option>
							<option>정상</option>
							<option>정지</option>
							<option>탈퇴</option></select>
						<button class="button">검색</button>
					</form>
					<div class="table-wrapper">
						<table class="admin-table">
							<thead>
								<tr>
									<th class="text-column">아이디</th>
									<th class="text-column">이름/닉네임</th>
									<th class="text-column">이메일</th>
									<th>가입일</th>
									<th>플랜</th>
									<th>신고</th>
									<th>상태</th>
									<th>관리</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="member:${members}">
									<td class="text-column" th:text="${member.id}">id</td>
									<td class="text-column" th:text="|${member.name} / ${member.nickname}|">이름</td>
									<td class="text-column" th:text="${member.email}">메일</td>
									<td th:text="${member.joinedAt}">날짜</td>
									<td th:text="${member.trips}">0</td>
									<td th:text="${member.reports}">0</td>
									<td><span class="badge"
										th:classappend="${member.status == '정상' ? ' success' : (member.status == '정지' ? ' danger' : ' muted')}"
										th:text="${member.status}">정상</span></td>
									<td><div class="table-actions">
											<a class="mini-button primary"
												th:href="@{/admin/members/{id}(id=${member.id})}">상세</a>
											<button class="mini-button"
												th:classappend="${member.status == '정지' ? ' success' : ' danger'}"
												type="button"
												th:text="${member.status == '정지' ? '정지 해제' : '회원 정지'}">정지</button>
										</div></td>
								</tr>
								<tr th:if="${#lists.isEmpty(members)}">
									<td colspan="8">조회된 회원이 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script th:src="@{/assets/admin/js/admin.js}"></script>
</body>
</html>
