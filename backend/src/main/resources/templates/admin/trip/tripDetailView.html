<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>여행 플랜 상세 | WithTrip</title>
	<link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}">
</head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{admin/fragments/layout :: sidebar('trips')}"></aside>
		<div class="admin-main">
			<header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header>
			<main class="admin-content">
				<div class="page-header">
					<div>
						<h1>여행 플랜 상세</h1>
						<p>공개 플랜의 일정, 방문 지점과 신고 이력을 확인합니다.</p>
					</div>
					<a class="button secondary" th:href="@{/admin/trips}">목록으로</a>
				</div>

				<article class="hero-card trip-hero-card">
					<span class="badge"
						th:classappend="${trip.visibilityLabel == '공개'} ? ' success' : ' muted'"
						th:text="${trip.visibilityLabel}">공개</span>
					<small class="trip-hero-id" th:text="${trip.planId}">1</small>
					<h2 th:text="${trip.title}">여행 플랜</h2>
					<p th:text="|작성자 ${trip.ownerName} / ${#dates.format(trip.startDate, 'yyyy.MM.dd')} ~ ${#dates.format(trip.endDate, 'yyyy.MM.dd')} / 참여자 ${trip.participantCount}명|">플랜 정보</p>
				</article>

				<div class="trip-top-grid">
					<article class="card">
						<div class="panel-heading">
							<h2>날짜별 여행 일정</h2>
							<div class="schedule-day-tabs" role="tablist" aria-label="여행 일차 선택">
								<button th:each="day, dayStat : ${scheduleDays}"
									type="button" role="tab" data-schedule-day-tab
									th:data-day="${day}"
									th:classappend="${dayStat.first} ? ' active'"
									th:aria-selected="${dayStat.first}"
									th:text="|${day}일차|">1일차</button>
							</div>
						</div>
						<ol class="schedule-list">
							<li th:each="schedule : ${schedules}"
								data-schedule-item
								th:data-day="${schedule.dayNo}"
								data-map-point
								th:data-name="${schedule.placeName}"
								th:data-coordinates="|${schedule.latitude},${schedule.longitude}|">
								<b th:text="${schedule.positionNo}">1</b>
								<div>
									<strong th:text="${schedule.placeName}">장소</strong>
									<p><span class="badge muted" th:text="|${schedule.dayNo}일차 · ${schedule.timeSlotLabel}|">1일차 · 오전</span></p>
								</div>
							</li>
						</ol>
						<p class="schedule-empty" th:if="${#lists.isEmpty(schedules)}">등록된 여행 일정이 없습니다.</p>
						<button class="schedule-more-button" type="button" data-schedule-more hidden>+ 더보기</button>
					</article>

					<div class="side-stack">
						<article class="card">
							<h2>일정 지도</h2>
							<div id="admin-plan-map"
								class="admin-plan-map"
								th:data-app-key="${kakaoJavascriptKey}"
								style="width:100%;border-radius:9px;background:#f3f4f6;">
							</div>
							<p id="admin-plan-map-message" role="status">지도를 불러오는 중입니다.</p>
						</article>

						<article class="card">
							<h2>콘텐츠 지표</h2>
							<div class="metric-grid">
								<div><span>좋아요</span><strong th:text="${trip.likeCount}">0</strong></div>
								<div><span>조회</span><strong th:text="${trip.viewCount}">0</strong></div>
								<div><span>플랜 복사</span><strong th:text="${trip.copyCount}">0</strong></div>
							</div>
						</article>
					</div>
				</div>

				<div class="trip-bottom-grid">
					<article class="card">
						<div class="panel-heading">
							<h2>신고 기록</h2>
							<span class="badge danger" th:text="|신고 ${#lists.size(reports)}건|">신고</span>
						</div>
						<div class="report-row" th:each="report : ${reports}">
							<span th:text="${#dates.format(report.createdAt, 'yyyy.MM.dd')}">날짜</span>
							<strong th:text="${#strings.isEmpty(report.reasonDetail) ? report.reasonCode : report.reasonDetail}">사유</strong>
							<span class="badge"
								th:classappend="${report.reportStatusLabel == '검토 완료'} ? ' success' : ' warning'"
								th:text="${report.reportStatusLabel}">상태</span>
							<a class="mini-button" th:href="@{/admin/reports/{reportId}(reportId=${report.reportId},planId=${trip.planId})}">상세</a>
						</div>
						<p th:if="${#lists.isEmpty(reports)}">신고 기록이 없습니다.</p>
					</article>

					<article class="card">
						<h2>플랜 상태</h2>
						<p>공개 범위: <strong th:text="${trip.visibilityLabel}">공개</strong></p>
						<p>플랜 상태: <strong th:text="${trip.planStatusLabel}">운영 중</strong></p>
						<p>지역: <strong th:text="${trip.regionName}">서울</strong></p>
					</article>
				</div>
			</main>
		</div>
	</div>

	<script th:src="@{/assets/admin/js/admin.js}"></script>
	<script>
		(() => {
			const tabs = [...document.querySelectorAll('[data-schedule-day-tab]')];
			const items = [...document.querySelectorAll('[data-schedule-item]')];
			const moreButton = document.querySelector('[data-schedule-more]');
			const visibleLimit = 5;
			let activeDay = tabs[0]?.dataset.day;
			let expanded = false;

			const renderSchedules = () => {
				const activeItems = items.filter((item) => item.dataset.day === activeDay);

				items.forEach((item) => {
					const dayItems = item.dataset.day === activeDay;
					const index = activeItems.indexOf(item);
					item.hidden = !dayItems || (!expanded && index >= visibleLimit);
				});

				tabs.forEach((tab) => {
					const active = tab.dataset.day === activeDay;
					tab.classList.toggle('active', active);
					tab.setAttribute('aria-selected', String(active));
				});

				if (moreButton) {
					moreButton.hidden = activeItems.length <= visibleLimit;
					moreButton.textContent = expanded ? '접기' : '+ 더보기';
				}
			};

			tabs.forEach((tab) => {
				tab.addEventListener('click', () => {
					activeDay = tab.dataset.day;
					expanded = false;
					renderSchedules();
				});
			});

			moreButton?.addEventListener('click', () => {
				expanded = !expanded;
				renderSchedules();
			});

			renderSchedules();
		})();

		(() => {
			const mapElement = document.getElementById('admin-plan-map');
			const messageElement = document.getElementById('admin-plan-map-message');
			const appKey = mapElement?.dataset.appKey?.trim();

			const showError = (message) => {
				messageElement.textContent = message;
			};

			if (!mapElement || !appKey) {
				showError('카카오 지도 JavaScript 키가 설정되지 않았습니다.');
				return;
			}

			const points = [...document.querySelectorAll('[data-map-point]')]
				.map((element) => {
					const [latitude, longitude] = element.dataset.coordinates
						.split(',')
						.map(Number);

					return {
						name: element.dataset.name,
						latitude,
						longitude,
					};
				})
				.filter((point) => Number.isFinite(point.latitude) && Number.isFinite(point.longitude));

			const query = new URLSearchParams({
				appkey: appKey,
				autoload: 'false',
			});
			const sdkScript = document.createElement('script');
			sdkScript.src = `https://dapi.kakao.com/v2/maps/sdk.js?${query.toString()}`;

			sdkScript.addEventListener('load', () => {
				if (!window.kakao?.maps) {
					showError('카카오 지도 SDK를 초기화하지 못했습니다.');
					return;
				}

				window.kakao.maps.load(() => {
					const initialPoint = points[0] ?? {
						latitude: 37.5665,
						longitude: 126.9780,
					};
					const map = new window.kakao.maps.Map(mapElement, {
						center: new window.kakao.maps.LatLng(initialPoint.latitude, initialPoint.longitude),
						level: 5,
					});
					const bounds = new window.kakao.maps.LatLngBounds();

					points.forEach((point) => {
						const position = new window.kakao.maps.LatLng(point.latitude, point.longitude);
						const marker = new window.kakao.maps.Marker({ map, position });
						const label = document.createElement('div');
						label.style.cssText = 'padding:6px 10px;white-space:nowrap;';
						label.textContent = point.name;
						const infoWindow = new window.kakao.maps.InfoWindow({ content: label });
						window.kakao.maps.event.addListener(marker, 'click', () => infoWindow.open(map, marker));
						bounds.extend(position);
					});

					if (points.length > 1) {
						map.setBounds(bounds);
					}

					messageElement.textContent = points.length > 0
						? `${points.length}개 일정 위치를 표시했습니다.`
						: '표시할 일정 좌표가 없습니다.';
				});
			}, { once: true });

			sdkScript.addEventListener('error', () => {
				showError('카카오 지도를 불러오지 못했습니다. 허용 도메인과 JavaScript 키를 확인해 주세요.');
			}, { once: true });

			document.head.appendChild(sdkScript);
		})();
	</script>
</body>
</html>
