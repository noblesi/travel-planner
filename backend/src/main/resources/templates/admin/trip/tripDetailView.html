<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행 플랜 상세 | WithTrip</title><link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}"></head><body><div class="admin-layout"><aside th:replace="~{admin/fragments/layout :: sidebar('trips')}"></aside><div class="admin-main"><header th:replace="~{admin/fragments/layout :: header(${pageTitle})}"></header><main class="admin-content">
<div class="page-header"><div><h1>여행 플랜 상세</h1><p>공개 플랜의 일정, 방문 지점과 신고 이력을 확인합니다.</p></div><a class="button secondary" th:href="@{/admin/trips}">목록으로</a></div><article class="hero-card"><span class="badge success">공개</span><h2>서울 궁궐 여행</h2><p>작성자 김민수 / 2026-08-16 ~ 2026-08-17 / 참여자 3명</p><small th:text="${tripId}">P-5412</small></article>
<div class="trip-top-grid"><article class="card"><div class="panel-heading"><h2>날짜별 여행 일정</h2><span class="badge warning">1일차</span></div><ol class="schedule-list"><li th:each="schedule:${schedules}"><b th:text="${schedule.order}">1</b><div><strong th:text="${schedule.name}">장소</strong><p><span class="badge muted" th:text="${schedule.timeSlot}">오전</span></p></div></li></ol><button class="mini-button" type="button">+ 더보기</button></article><div class="side-stack"><article class="card"><h2>일정 지도</h2><div class="map-placeholder"><strong>서울 여행 동선</strong><span th:each="schedule:${schedules}" th:text="|${schedule.order}. ${schedule.name} (${schedule.coordinates})|">장소</span></div></article><article class="card"><h2>콘텐츠 지표</h2><div class="metric-grid"><div th:each="metric:${metrics}"><span th:text="${metric.label}">지표</span><strong th:text="${metric.value}">0</strong></div></div></article></div></div>
<div class="trip-bottom-grid"><article class="card"><div class="panel-heading"><h2>신고 기록</h2><span class="badge danger" th:text="|신고 ${#lists.size(reports)}건|">신고</span></div><div class="report-row" th:each="report:${reports}"><span th:text="${report.date}">날짜</span><strong th:text="${report.reason}">사유</strong><span class="badge" th:classappend="${report.status == '검토 완료' ? ' success' : ' warning'}" th:text="${report.status}">상태</span><a class="mini-button" th:href="@{/admin/reports/{id}(id=${report.id})}">상세</a></div></article><article class="card"><h2>추천 점수 상세</h2><div class="score-row" th:each="metric:${metrics}"><span th:text="${metric.label}">점수</span><div class="score-track"><i th:style="|width:${metric.score}%|"></i></div><strong th:text="|${metric.score}점|">0점</strong></div></article></div>
</main></div></div><script th:src="@{/assets/admin/js/admin.js}"></script></body></html>
