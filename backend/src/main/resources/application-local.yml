spring:
  datasource:
    url: jdbc:h2:mem:travel_planner;MODE=Oracle;DATABASE_TO_UPPER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql

app:
  auth:
    local-member-id: ${LOCAL_MEMBER_ID:1}
