spring:
  datasource:
    url: jdbc:h2:mem:travel_planner;MODE=Oracle;DATABASE_TO_UPPER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql

app:
  auth:
    enforce-security: ${AUTH_ENFORCE_SECURITY:false}
    local-member-id: ${LOCAL_MEMBER_ID:1}
    local-login:
      member-id: ${LOCAL_AUTH_MEMBER_ID:${LOCAL_MEMBER_ID:1}}
      email: ${LOCAL_AUTH_EMAIL:}
      password: ${LOCAL_AUTH_PASSWORD:}
      display-name: ${LOCAL_AUTH_DISPLAY_NAME:Local Member}

server:
  servlet:
    session:
      cookie:
        secure: false
